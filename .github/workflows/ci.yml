name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Lint
        run: npm run lint
      - name: Type-check (app, stories, Storybook config, scripts and the /mcp function)
        run: npx tsc --noEmit -p .storybook

      # Builds the generated docs, the static Storybook, llms.txt and the per-page Markdown,
      # then fails if any component is missing its summary, description, import line or
      # prop docs, or if an exported component has no story. Runs before the tests, which
      # serve the generated docs' static files.
      - name: Build Storybook and check docs coverage
        run: npm run build-storybook

      - name: Install Chromium for the story tests
        run: npx playwright install --with-deps chromium
      # The unit tests, then every story rendered in Chromium with an axe check; any axe
      # violation fails. Story dependencies are pinned in src/test/storyDeps.ts, so a cold
      # Vite cache doesn't re-optimize mid-run.
      - name: Unit and story tests
        run: npm test
      - name: Build the app
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 7
